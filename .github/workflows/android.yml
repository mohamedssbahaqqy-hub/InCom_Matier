name: Build InCom Matier APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Capacitor
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Create Capacitor configuration
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.incomgroup.operations",
            "appName": "InCom Opérations",
            "webDir": "www",
            "bundledWebRuntime": false
          }
          EOF

      - name: Prepare web files
        run: |
          mkdir -p www
          cp index.html www/index.html
          cp style.css www/style.css
          cp script.js www/script.js

      - name: Create Android project
        run: |
          npx cap add android

      - name: Copy web files to Android
        run: |
          npx cap copy android

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: InCom-Operations-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
